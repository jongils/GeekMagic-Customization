; GeekMagic SmallTV Ultra — Custom ESP8266 Firmware
; PlatformIO Project Configuration

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino

; 160MHz for better rendering performance
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs

lib_deps =
    Bodmer/TFT_eSPI               @ ^2.5.43
    bblanchon/ArduinoJson         @ ^7.3.1
    bitbank2/JPEGDEC              @ ^1.2.9
    arduino-libraries/NTPClient   @ ^3.2.1
    tzapu/WiFiManager             @ ^2.0.17

build_flags =
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; TFT pin config — KAHD154010C10-V3 (ST7789V, community confirmed)
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_BL=5
    ; Display driver — ST7789V (1.54" 240x240 IPS)
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DSPI_FREQUENCY=40000000

monitor_speed = 115200
upload_speed = 460800

[env:esp8266_ota]
extends = env:esp8266
upload_protocol = espota
upload_port = 192.168.219.122

[env:esp8266_diag]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
build_src_filter = -<*> +<../diag/>
monitor_speed = 115200
upload_speed = 460800

[env:esp8266_bezel]
; Bezel boundary tester — draws 5px-interval lines inward from all 4 edges
extends = env:esp8266
build_src_filter = -<*> +<../diag_bezel/>

[env:esp8266_bezel_ota]
extends = env:esp8266_bezel
upload_protocol = espota
upload_port = 192.168.219.122
